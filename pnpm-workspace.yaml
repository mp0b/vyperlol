# Single-package repo; this file exists to declare pnpm settings that moved
# out of package.json in pnpm 10+. These native deps are allowed to run their
# install scripts (fetch engines / prebuilt binaries).
allowBuilds:
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  '@embedded-postgres/linux-arm64': set this to true or false
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - sharp
  - esbuild
  - unrs-resolver
  - "@embedded-postgres/windows-x64"
